<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Paper Texture Tone -->
    <linearGradient id="stampPaperGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf8" />
      <stop offset="100%" stop-color="#f2ebe0" />
    </linearGradient>

    <!-- Cedar Green Ink Gradient -->
    <linearGradient id="stampInkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e5444" />
      <stop offset="100%" stop-color="#12372c" />
    </linearGradient>

    <filter id="circularStampShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#12372c" flood-opacity="0.16" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="#f4eee2" stroke="#e0d5c3" stroke-width="2" />

  <!-- The Circular Postal Stamp Emblem -->
  <g filter="url(#circularStampShadow)">
    <!-- Outer Ring -->
    <circle cx="266" cy="256" r="168" fill="none" stroke="#1a4d3e" stroke-width="7" />
    <circle cx="266" cy="256" r="154" fill="none" stroke="#1a4d3e" stroke-width="2" stroke-dasharray="6 4" />

    <!-- Circular Curved Text Path -->
    <path id="topTextArc" d="M 140 256 A 126 126 0 0 1 392 256" fill="none" />
    <path id="bottomTextArc" d="M 392 256 A 126 126 0 0 1 140 256" fill="none" />

    <text font-family="system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="4" fill="#1a4d3e">
      <textPath href="#topTextArc" startOffset="50%" text-anchor="middle">
        CIVIC • POSTAL DECODER
      </textPath>
    </text>

    <text font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#1a4d3e">
      <textPath href="#bottomTextArc" startOffset="50%" text-anchor="middle">
        AUTHENTICATED • VERIFIED
      </textPath>
    </text>

    <!-- Center Box enclosing "TL;DR" -->
    <rect x="136" y="212" width="260" height="88" rx="22" fill="#faf7f0" stroke="#1a4d3e" stroke-width="6" />

    <!-- Bold Central "TL;DR" Typography -->
    <text x="250" y="272" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" letter-spacing="2" fill="#1a4d3e">
      TL<tspan fill="#f59e0b">;</tspan>DR
    </text>

    <!-- Dynamic Postal Checkmark Swoosh cutting through the box -->
    <path d="M 216 286 L 244 322 L 358 178" fill="none" stroke="#d97706" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.92" />
    <path d="M 216 286 L 244 322 L 358 178" fill="none" stroke="#fbbf24" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Left Postal Cancellation Waves -->
    <path d="M 44 236 Q 64 226 84 236 T 124 236" fill="none" stroke="#1a4d3e" stroke-width="3" stroke-linecap="round" />
    <path d="M 44 252 Q 64 242 84 252 T 124 252" fill="none" stroke="#1a4d3e" stroke-width="3" stroke-linecap="round" />
    <path d="M 44 268 Q 64 258 84 268 T 124 268" fill="none" stroke="#1a4d3e" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e5444" />
      <stop offset="100%" stop-color="#12372c" />
    </linearGradient>

    <!-- Paper Gradient -->
    <linearGradient id="paperGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f5f0e6" />
    </linearGradient>

    <!-- Emerald Check Gradient -->
    <linearGradient id="checkGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="softShadow1" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0a1d17" flood-opacity="0.35" />
    </filter>
    <filter id="cardShadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0a1d17" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad1)" filter="url(#softShadow1)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#34d399" stroke-width="2" stroke-opacity="0.18" />

  <!-- The Decoded Paper Card sliding up -->
  <g filter="url(#cardShadow1)">
    <rect x="136" y="110" width="240" height="230" rx="18" fill="url(#paperGrad1)" stroke="#e2d9cc" stroke-width="2" />
    
    <!-- 3 TL;DR Bullet Lines -->
    <!-- Line 1: Short header badge -->
    <rect x="168" y="146" width="68" height="12" rx="6" fill="#1a4d3e" opacity="0.85" />
    
    <!-- Line 2: Main summary bar -->
    <rect x="168" y="174" width="176" height="14" rx="7" fill="#1a4d3e" />
    
    <!-- Line 3: Secondary action bar -->
    <rect x="168" y="202" width="132" height="14" rx="7" fill="#2d7a64" opacity="0.8" />
    
    <!-- Line 4: Action step with checkmark -->
    <rect x="168" y="230" width="94" height="14" rx="7" fill="#047857" opacity="0.6" />
    
    <!-- Emerald Circle with Checkmark -->
    <circle cx="316" cy="237" r="22" fill="url(#checkGrad1)" />
    <path d="M307 237 L313 243 L326 230" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Envelope Back Flap Silhouette (Interior) -->
  <path d="M100 240 L256 340 L412 240" fill="none" stroke="#236653" stroke-width="4" stroke-linecap="round" opacity="0.4" />

  <!-- Envelope Front Body -->
  <path d="M96 232 L96 376 C96 394 110 408 128 408 L384 408 C402 408 416 394 416 376 L416 232 L268 336 C261 341 251 341 244 336 Z" 
        fill="#144133" stroke="#2a7761" stroke-width="3" />

  <!-- Envelope Fold Lines (Left & Right) -->
  <path d="M96 396 L226 296" stroke="#0d2b22" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />
  <path d="M416 396 L286 296" stroke="#0d2b22" stroke-width="3.5" stroke-linecap="round" opacity="0.6" />

  <!-- Subtle bottom highlight glow -->
  <ellipse cx="256" cy="406" rx="140" ry="2" fill="#34d399" opacity="0.4" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Lens Rim Gradient -->
    <linearGradient id="lensRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Lens Fill Gradient -->
    <radialGradient id="lensFill" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a4d3e" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f2b23" stop-opacity="0.98" />
    </radialGradient>

    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#059669" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Canvas Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad3)" />
  <rect x="24" y="24" width="464" height="464" rx="108" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Background Official Legal Document (Muted / Intimidating) -->
  <g opacity="0.45">
    <rect x="96" y="96" width="320" height="320" rx="16" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" />
    <!-- Fine dense micro-print lines (intimidating legal jargon) -->
    <line x1="126" y1="136" x2="386" y2="136" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <line x1="126" y1="156" x2="350" y2="156" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="174" x2="386" y2="174" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="192" x2="330" y2="192" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="210" x2="370" y2="210" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="228" x2="360" y2="228" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="246" x2="386" y2="246" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="264" x2="340" y2="264" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="282" x2="375" y2="282" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="300" x2="386" y2="300" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="318" x2="320" y2="318" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="336" x2="360" y2="336" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="354" x2="386" y2="354" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
    <line x1="126" y1="372" x2="280" y2="372" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- The Magic Clarity Scanner Lens Overlay (Reveals TL;DR) -->
  <g filter="url(#glow3)">
    <circle cx="280" cy="270" r="142" fill="url(#lensFill)" stroke="url(#lensRim)" stroke-width="7" />
    
    <!-- Camera Viewfinder Corner Ticks -->
    <path d="M 230 178 L 210 178 L 210 198" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <path d="M 330 178 L 350 178 L 350 198" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <path d="M 210 342 L 210 362 L 230 362" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />
    <path d="M 350 342 L 350 362 L 330 362" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" />

    <!-- Inside the Lens: Crystal Clear Plain-Language 3-Bar Summary -->
    <rect x="200" y="218" width="60" height="12" rx="6" fill="#facc15" />
    <rect x="200" y="244" width="160" height="16" rx="8" fill="#ffffff" />
    <rect x="200" y="272" width="130" height="14" rx="7" fill="#6ee7b7" />
    <rect x="200" y="298" width="90" height="12" rx="6" fill="#a7f3d0" />

    <!-- Sharp Checkmark inside badge -->
    <circle cx="330" cy="304" r="18" fill="#10b981" />
    <path d="M 322 304 L 328 310 L 338 298" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7" />
      <stop offset="100%" stop-color="#f0e9dc" />
    </linearGradient>

    <!-- Origami Facet 1: House Roof Left / Left Flap -->
    <linearGradient id="facetRoofLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a7a62" />
      <stop offset="100%" stop-color="#1b5343" />
    </linearGradient>

    <!-- Origami Facet 2: House Roof Right / Right Flap -->
    <linearGradient id="facetRoofRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a4d3e" />
      <stop offset="100%" stop-color="#12382d" />
    </linearGradient>

    <!-- Origami Facet 3: Center Apex Sun / Hearth -->
    <linearGradient id="facetCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Origami Facet 4: Lower Envelope Base -->
    <linearGradient id="facetBaseLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144133" />
      <stop offset="100%" stop-color="#0c261e" />
    </linearGradient>

    <linearGradient id="facetBaseRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1d5c49" />
      <stop offset="100%" stop-color="#133d30" />
    </linearGradient>

    <!-- Drop Shadow for Folded Craft -->
    <filter id="origamiShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#12372c" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Canvas Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad5)" stroke="#e4dbcc" stroke-width="2" />

  <!-- Origami Shelter / Mail Figure -->
  <g filter="url(#origamiShadow)">
    <!-- 1. The Peaked Roof (Shelter Silhouette forming top flap) -->
    <!-- Left Roof Slant -->
    <polygon points="256,92 116,212 256,236" fill="url(#facetRoofLeft)" />
    
    <!-- Right Roof Slant -->
    <polygon points="256,92 396,212 256,236" fill="url(#facetRoofRight)" />

    <!-- Overhanging Eaves Highlights -->
    <line x1="256" y1="92" x2="116" y2="212" stroke="#5eead4" stroke-width="2" stroke-opacity="0.6" />
    <line x1="256" y1="92" x2="396" y2="212" stroke="#5eead4" stroke-width="1.5" stroke-opacity="0.3" />

    <!-- 2. The Inner Letter Heart (Emerging Fold / Hearth) -->
    <polygon points="256,152 196,208 256,260 316,208" fill="#fffdfa" stroke="#ded5c4" stroke-width="2" />
    <!-- 3 Mini Summary Accent Lines on Document Heart -->
    <line x1="230" y1="198" x2="282" y2="198" stroke="#1a4d3e" stroke-width="3.5" stroke-linecap="round" />
    <line x1="236" y1="210" x2="276" y2="210" stroke="#047857" stroke-width="3" stroke-linecap="round" />
    <circle cx="256" cy="224" r="3.5" fill="#10b981" />

    <!-- 3. Lower Envelope Pocket / Home Walls -->
    <!-- Left Base Facet -->
    <polygon points="116,212 116,376 256,312 256,236" fill="url(#facetBaseLeft)" />
    
    <!-- Right Base Facet -->
    <polygon points="396,212 396,376 256,312 256,236" fill="url(#facetBaseRight)" />

    <!-- Bottom Envelope Triangular Fold -->
    <polygon points="116,376 396,376 256,312" fill="#0d2e23" />
    
    <!-- Subtle Golden Light radiating from shelter base -->
    <polygon points="230,376 282,376 256,340" fill="#f59e0b" opacity="0.8" />
  </g>

  <!-- Calming Horizon Accent Bar -->
  <line x1="140" y1="416" x2="372" y2="416" stroke="#1a4d3e" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.4" />
</svg>
